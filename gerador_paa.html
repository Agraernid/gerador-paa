<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Anexos - PAA Agraer 2026</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f4f4; }
        .container { max-width: 1000px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h1, h2 { color: #2c3e50; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 14px; }
        input, select { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .row { display: flex; gap: 10px; }
        .row > div { flex: 1; }
        button { background-color: #27ae60; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; margin-top: 10px; }
        button:hover { background-color: #219150; }
        button.limpar { background-color: #e67e22; }
        button.limpar:hover { background-color: #d35400; }
        button.imprimir { background-color: #2980b9; font-size: 18px; padding: 12px 30px; }
        button.imprimir:hover { background-color: #1c5a85; }
        button.voltar { background-color: #7f8c8d; }
        button.voltar:hover { background-color: #5a6268; }
        .hidden { display: none; }
        
        .print-area { margin-top: 30px; border-top: 2px dashed #ccc; padding-top: 20px; }
        .anexo { 
            page-break-after: always; 
            border: 1px solid #000; 
            padding: 20px; 
            margin-bottom: 20px; 
            font-size: 12px; 
            line-height: 1.6;
            text-align: justify;
        }
        .anexo h3 { text-align: center; text-transform: uppercase; }
        .anexo table { width: 100%; border-collapse: collapse; margin-top: 10px; text-align: left; }
        .anexo table, .anexo th, .anexo td { border: 1px solid black; }
        .anexo th, .anexo td { padding: 5px; }
        .anexo .assinatura { margin-top: 50px; text-align: center; }
        .anexo .assinatura div { border-top: 1px solid black; width: 300px; margin: 0 auto; padding-top: 5px; }
        
        .produto-item { display: grid; grid-template-columns: 3fr 1fr 1fr 1fr 1fr 1fr 0.5fr; gap: 8px; align-items: end; margin-bottom: 10px; padding: 10px; background: #eee; border-radius: 4px; }
        .produto-item label { font-size: 11px; margin-bottom: 3px; }
        .produto-item input, .produto-item select { padding: 6px; font-size: 13px; }
        .produto-item button { background-color: #e74c3c; padding: 6px 10px; font-size: 12px; margin: 0; height: 33px; }
        .produto-item .readonly { background: #ddd; color: #555; }
        
        .header-produtos { display: grid; grid-template-columns: 3fr 1fr 1fr 1fr 1fr 1fr 0.5fr; gap: 8px; font-weight: bold; font-size: 12px; padding: 0 10px; margin-bottom: 5px; }
        
        .barra-acoes { text-align: center; margin: 20px 0; padding: 15px; background: #ecf0f1; border-radius: 8px; }

        /* ===== REGRAS EXCLUSIVAS PARA IMPRESSÃO ===== */
        @media print {
            /* Esconde tudo que não é o anexo */
            body { background: white; margin: 0; padding: 0; }
            .container { box-shadow: none; margin: 0; padding: 0; max-width: 100%; border-radius: 0; }
            #formulario { display: none !important; } /* Esconde o formulário de cadastro */
            h1, p { display: none !important; } /* Esconde títulos e instruções do topo */
            .barra-acoes { display: none !important; } /* Esconde os botões de ação */
            .print-area { margin: 0; padding: 0; border: none; }
            
            /* Ajusta o Anexo para o tamanho A4 */
            .anexo {
                page-break-after: always;
                border: 1px solid black;
                padding: 15mm;
                margin: 0;
                width: 100%;
                height: 100%;
                box-sizing: border-box;
                font-size: 11pt;
                text-align: justify;
            }
            
            /* Evita que o último anexo crie uma página em branco no final */
            .anexo:last-child {
                page-break-after: auto;
            }
        }
        
        @page {
            size: A4;
            margin: 0;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Gerador de Anexos - PAA/CDS 2026</h1>
    <p>Preencha os dados abaixo e clique em <strong>Gerar Anexos</strong> para visualizar os formulários prontos para impressão.</p>

    <div id="formulario">
        <h2>1. Dados do Agricultor</h2>
        <div class="row">
            <div class="form-group">
                <label>Nome Completo:</label>
                <input type="text" id="nome" placeholder="Ex: João da Silva">
            </div>
            <div class="form-group">
                <label>CPF:</label>
                <input type="text" id="cpf" placeholder="000.000.000-00">
            </div>
        </div>
        <div class="row">
            <div class="form-group">
                <label>RG/RANI:</label>
                <input type="text" id="rg" placeholder="0000000">
            </div>
            <div class="form-group">
                <label>Nº DAP/CAF:</label>
                <input type="text" id="dap" placeholder="000.000.000/0000-00">
            </div>
            <div class="form-group">
                <label>Nº NIS:</label>
                <input type="text" id="nis" placeholder="00000000000">
            </div>
        </div>
        <div class="row">
            <div class="form-group">
                <label>Endereço (Rua, Nº, Bairro):</label>
                <input type="text" id="endereco" placeholder="Sítio Boa Vista, Zona Rural">
            </div>
            <div class="form-group">
                <label>Município:</label>
                <input type="text" id="municipio" placeholder="Campo Grande">
            </div>
        </div>
        <div class="row">
            <div class="form-group">
                <label>CEP:</label>
                <input type="text" id="cep" placeholder="79000-000">
            </div>
            <div class="form-group">
                <label>Telefone (DDD+Fone):</label>
                <input type="text" id="telefone" placeholder="67 99999-9999">
            </div>
            <div class="form-group">
                <label>Nº Inscrição Estadual:</label>
                <input type="text" id="inscricao_estadual" placeholder="000000000">
            </div>
        </div>

        <h2>2. Produtos (Projeto de Venda)</h2>
        
        <div class="header-produtos">
            <div>Produto</div>
            <div>Unidade</div>
            <div>Quantidade</div>
            <div>Preço (R$)</div>
            <div>Total (R$)</div>
            <div>Periodicidade</div>
            <div></div>
        </div>
        
        <div id="lista-produtos"></div>
        
        <button type="button" onclick="adicionarProduto()">+ Adicionar Produto</button>
        <button type="button" class="limpar" onclick="limparTudo()">Limpar Tudo</button>

        <br><br>
        <button onclick="gerarAnexos()">Gerar Anexos</button>
    </div>

    <div id="area-impressao" class="print-area hidden">
        <div class="barra-acoes">
            <button class="voltar" onclick="voltarParaFormulario()">← Voltar e Editar</button>
            <button class="imprimir" onclick="window.print()">🖨️ Imprimir Documentos</button>
        </div>
        <div id="conteudo-anexos"></div>
    </div>
</div>

    let contadorProdutos = 0;

    function adicionarProduto() {
        contadorProdutos++;
        const container = document.getElementById('lista-produtos');
        
        const div = document.createElement('div');
        div.className = 'produto-item';
        div.id = `produto-${contadorProdutos}`;
        
        let options = '<option value="">Selecione...</option>';
        tabelaPrecos.forEach((item, index) => {
            options += `<option value="${index}">${item.produto}</option>`;
        });

        div.innerHTML = `
            <div><label>Produto</label><select class="produto-select" onchange="atualizarDadosProduto(this)">${options}</select></div>
            <div><label>Unidade</label><input type="text" class="produto-unidade readonly" readonly placeholder="-"></div>
            <div><label>Quantidade</label><input type="number" class="produto-qtd" placeholder="0" min="1" oninput="calcularTotal(this)"></div>
            <div><label>Preço (R$)</label><input type="text" class="produto-preco readonly" readonly placeholder="0,00"></div>
            <div><label>Total (R$)</label><input type="text" class="produto-total readonly" readonly placeholder="0,00"></div>
            <div><label>Periodicidade</label><input type="text" class="produto-periodicidade" placeholder="Ex: Mensal"></div>
            <div><button type="button" onclick="removerProduto(${contadorProdutos})">X</button></div>
        `;
        
        container.appendChild(div);
    }

    function removerProduto(id) {
        document.getElementById(`produto-${id}`).remove();
    }

    function atualizarDadosProduto(selectElement) {
        const index = selectElement.value;
        const divPai = selectElement.closest('.produto-item');
        const inputUnidade = divPai.querySelector('.produto-unidade');
        const inputPreco = divPai.querySelector('.produto-preco');
        const inputQtd = divPai.querySelector('.produto-qtd');
        const inputTotal = divPai.querySelector('.produto-total');
        
        if (index === "") {
            inputUnidade.value = ""; inputPreco.value = ""; inputTotal.value = "";
            return;
        }

        const produto = tabelaPrecos[index];
        inputUnidade.value = produto.unidade;
        inputPreco.value = produto.convencional.toFixed(2).replace('.', ',');
        calcularTotal(inputQtd);
    }

    function calcularTotal(inputQtd) {
        const divPai = inputQtd.closest('.produto-item');
        const inputPreco = divPai.querySelector('.produto-preco');
        const inputTotal = divPai.querySelector('.produto-total');
        
        const qtd = parseFloat(inputQtd.value) || 0;
        const preco = parseFloat(inputPreco.value.replace(',', '.')) || 0;
        inputTotal.value = (qtd * preco).toFixed(2).replace('.', ',');
    }

    function limparTudo() {
        if (confirm("Tem certeza que deseja limpar todos os dados preenchidos?")) {
            document.getElementById('formulario').reset();
            document.getElementById('lista-produtos').innerHTML = '';
            contadorProdutos = 0;
            voltarParaFormulario();
        }
    }

        const dados = {
            nome: document.getElementById('nome').value || "_________________________",
            cpf: document.getElementById('cpf').value || "_________________________",
            rg: document.getElementById('rg').value || "_________________________",
            dap: document.getElementById('dap').value || "_________________________",
            nis: document.getElementById('nis').value || "_________________________",
            endereco: document.getElementById('endereco').value || "_________________________",
            municipio: document.getElementById('municipio').value || "_________________________",
            cep: document.getElementById('cep').value || "_________________________",
            telefone: document.getElementById('telefone').value || "_________________________",
            inscricao_estadual: document.getElementById('inscricao_estadual').value || "_________________________"
        };

        const produtos = [];
        const itens = document.querySelectorAll('.produto-item');
        let erro = false;
        
        itens.forEach(item => {
            const select = item.querySelector('.produto-select');
            const unidade = item.querySelector('.produto-unidade').value;
            const qtd = item.querySelector('.produto-qtd').value;
            const preco = item.querySelector('.produto-preco').value;
            const total = item.querySelector('.produto-total').value;
            const periodicidade = item.querySelector('.produto-periodicidade').value || "A definir";
            
            if (select.value !== "") {
                if (!qtd || qtd <= 0) {
                    erro = true; alert("Por favor, preencha a quantidade de todos os produtos selecionados."); return;
                }
                const produtoBase = tabelaPrecos[select.value];
                produtos.push({ nome: produtoBase.produto, unidade, quantidade: qtd, preco, total, periodicidade });
            }
        });

        if (erro) return;
        if (produtos.length === 0) { alert("Adicione pelo menos um produto."); return; }

        let htmlAnexos = '';

                <p>DECLARAÇÃO DE QUE OS GÊNEROS ALIMENTÍCIOS A SEREM ENTREGUES SÃO ORIUNDOS DE PRODUÇÃO PRÓPRIA, RELACIONADOS NO PROJETO DE VENDA.</p>
                <br>
                <p>Eu, <strong>${dados.nome}</strong>, nacionalidade brasileira, estado civil ________________, Agricultor Familiar, portador(a) do RG/RANI n.º <strong>${dados.rg}</strong> e do CPF n.º <strong>${dados.cpf}</strong>, residente e domiciliado em <strong>${dados.endereco}, ${dados.municipio} - MS</strong>, DECLARO, para fins de participação no Chamamento Público de Credenciamento de Agricultores Familiares SEMADESC/PAA/CDS n.º 003/2026 para aquisição de gêneros alimentícios da agricultura familiar, no âmbito do Programa de Aquisição de Alimentos – Modalidade Compra com Doação Simultânea – com dispensa de licitação para doação a pessoas e famílias em situação de vulnerabilidade social, que os gêneros alimentícios relacionados na Proposta de Venda em meu nome são oriundos de produção própria.</p>
                <p>Declaro, ainda, estar ciente de que as Notas Fiscais Eletrônicas de Produtor a serem emitidas pela minha Inscrição Estadual, destinam-se exclusivamente à comercialização de minha própria produção, sendo vedada a cessão a terceiros.</p>
                <br>
                <p style="text-align: center;">Município de ${dados.municipio}/MS, _____ de _____________ de 2026.</p>
                <div class="assinatura"><div>Assinatura e Nome do agricultor(a)<br>Número do CPF</div></div>
            </div>
        `;

        htmlAnexos += `
            <div class="anexo">
                <h3>ANEXO II - DECLARAÇÃO DE RESPONSABILIDADE PELO CONTROLE DO ATENDIMENTO DO LIMITE INDIVIDUAL DE VENDA</h3>
