<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

    <title>Gerador de Anexos - PAA Agraer 2026</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f4f4; }
        .container { max-width: 1000px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h1, h2 { color: #2c3e50; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 14px; }
        input, select { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .row { display: flex; gap: 10px; }
        .row > div { flex: 1; }
        button { background-color: #27ae60; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; margin-top: 10px; }
        button:hover { background-color: #219150; }
        button.limpar { background-color: #e67e22; }
        button.limpar:hover { background-color: #d35400; }
        button.imprimir { background-color: #2980b9; font-size: 18px; padding: 12px 30px; }
        button.imprimir:hover { background-color: #1c5a85; }
        button.voltar { background-color: #7f8c8d; }
        button.voltar:hover { background-color: #5a6268; }
        .hidden { display: none; }
        
        .print-area { margin-top: 30px; border-top: 2px dashed #ccc; padding-top: 20px; }
        .anexo { 
            page-break-after: always; 
            padding: 20px; 
            margin-bottom: 20px; 
            font-size: 12px; 
            line-height: 1.6;
            text-align: justify;
        }
        .anexo h3 { text-align: center; text-transform: uppercase; }
        .anexo table { width: 100%; border-collapse: collapse; margin-top: 10px; text-align: left; }
        .anexo table, .anexo th, .anexo td { border: 1px solid black; }
        .anexo th, .anexo td { padding: 5px; }
        .anexo .assinatura { margin-top: 40px; text-align: center; }
        .anexo .assinatura div { border-top: 1px solid black; width: 300px; margin: 0 auto; padding-top: 5px; }
        .anexo .assinatura + .assinatura { margin-top: 30px; }
        
        .produto-item { display: grid; grid-template-columns: 3fr 1fr 1fr 1fr 1fr 1fr 0.5fr; gap: 8px; align-items: end; margin-bottom: 10px; padding: 10px; background: #eee; border-radius: 4px; }
        .produto-item label { font-size: 11px; margin-bottom: 3px; }
        .produto-item input, .produto-item select { padding: 6px; font-size: 13px; }
        .produto-item button { background-color: #e74c3c; padding: 6px 10px; font-size: 12px; margin: 0; height: 33px; }
        .produto-item .readonly { background: #ddd; color: #555; }
        
        .barra-acoes { text-align: center; margin: 20px 0; padding: 15px; background: #ecf0f1; border-radius: 8px; }

        .caixa-declarante { background: #fffbe6; padding: 15px; border-radius: 6px; border: 1px dashed #f1c40f; margin-top: 10px; }
        .caixa-declarante label { display: inline-flex; align-items: center; gap: 8px; font-weight: bold; cursor: pointer; }
        .caixa-declarante input[type="checkbox"] { width: auto; margin: 0; }

        @media print {
            body { background: white; margin: 0; padding: 0; }
            .container { box-shadow: none; margin: 0; padding: 0; max-width: 100%; border-radius: 0; }
            #formulario { display: none !important; }
            .no-print { display: none !important; }
            .barra-acoes { display: none !important; }
            .print-area { margin: 0; padding: 0; border: none; }
            
            .anexo {
                page-break-after: always;
                padding: 15mm;
                margin: 0;
                width: 100%;
                height: 100%;
                box-sizing: border-box;
                font-size: 11pt;
                text-align: justify;
                display: block !important;
            }
            
            .anexo p {
                display: block !important;
                margin: 5px 0;
            }
            
            .anexo:last-child { page-break-after: auto; }
        }
        
        @page { size: A4; margin: 0; }
    </style>
</head>

        <h2>2. Tipo de Preço</h2>

        <div class="caixa-declarante">

            </label>

        <button type="button" class="limpar" onclick="limparTudo()">Limpar Tudo</button>

        <br><br>
        <button onclick="gerarAnexos()">Gerar Anexos</button>
    </div>

    <div id="area-impressao" class="print-area hidden">

</div>

    let contadorProdutos = 0;

        function toggleDeclarante() {
        const checkbox = document.getElementById('declarante_terceiro');
        const campo = document.getElementById('campo_declarante');
        if (checkbox.checked) {
            campo.classList.remove('hidden');
        } else {
            campo.classList.add('hidden');
            document.getElementById('nome_declarante').value = '';
            document.getElementById('rg_declarante').value = '';
            document.getElementById('cpf_declarante').value = '';
            document.getElementById('endereco_declarante').value = '';
        }
    }

    function formatarDataAtual() {
        const meses = ["janeiro", "fevereiro", "março", "abril", "maio", "junho", "julho", "agosto", "setembro", "outubro", "novembro", "dezembro"];
        const hoje = new Date();
        return `${hoje.getDate()} de ${meses[hoje.getMonth()]} de ${hoje.getFullYear()}`;
    }

    function adicionarProduto() {
        contadorProdutos++;
        const container = document.getElementById('lista-produtos');
        
        const div = document.createElement('div');
        div.className = 'produto-item';
        div.id = `produto-${contadorProdutos}`;
        
        let options = '<option value="">Selecione...</option>';
        tabelaPrecos.forEach((item, index) => {
            options += `<option value="${index}">${item.produto}</option>`;
        });

        div.innerHTML = `
            <div><label>Produto</label><select class="produto-select" onchange="atualizarDadosProduto(this)">${options}</select></div>
            <div><label>Unidade</label><input type="text" class="produto-unidade readonly" readonly placeholder="-"></div>
            <div><label>Quantidade</label><input type="number" class="produto-qtd" placeholder="0" min="1" oninput="calcularTotal(this)"></div>
            <div><label>Preço (R$)</label><input type="text" class="produto-preco readonly" readonly placeholder="0,00"></div>
            <div><label>Total (R$)</label><input type="text" class="produto-total readonly" readonly placeholder="0,00"></div>
            <div><label>Periodicidade</label><input type="text" class="produto-periodicidade" placeholder="Ex: Mensal"></div>
            <div><button type="button" onclick="removerProduto(${contadorProdutos})">X</button></div>
        `;
        
        container.appendChild(div);
    }

    function removerProduto(id) {
        document.getElementById(`produto-${id}`).remove();
    }

    function obterPreco(produto) {
        const tipo = document.getElementById('tipo_preco').value;
        return tipo === 'organico' ? produto.organico : produto.convencional;
    }

    function atualizarDadosProduto(selectElement) {
        const index = selectElement.value;
        const divPai = selectElement.closest('.produto-item');
        const inputUnidade = divPai.querySelector('.produto-unidade');
        const inputPreco = divPai.querySelector('.produto-preco');
        const inputQtd = divPai.querySelector('.produto-qtd');
        const inputTotal = divPai.querySelector('.produto-total');
        
        if (index === "") {
            inputUnidade.value = ""; inputPreco.value = ""; inputTotal.value = "";
            return;
        }

        const produto = tabelaPrecos[index];
        inputUnidade.value = produto.unidade;
        inputPreco.value = obterPreco(produto).toFixed(2).replace('.', ',');
        calcularTotal(inputQtd);
    }

    function calcularTotal(inputQtd) {
        const divPai = inputQtd.closest('.produto-item');
        const inputPreco = divPai.querySelector('.produto-preco');
        const inputTotal = divPai.querySelector('.produto-total');
        
        const qtd = parseFloat(inputQtd.value) || 0;
        const preco = parseFloat(inputPreco.value.replace(',', '.')) || 0;
        inputTotal.value = (qtd * preco).toFixed(2).replace('.', ',');
    }

    // Atualiza todos os preços quando o tipo de preço é alterado
    document.getElementById('tipo_preco').addEventListener('change', function() {
        document.querySelectorAll('.produto-item').forEach(item => {
            const select = item.querySelector('.produto-select');
            if (select.value !== "") {
                atualizarDadosProduto(select);
            }
        });
    });

    function limparTudo() {

            document.getElementById('cep').value = '';
            document.getElementById('telefone').value = '';
            document.getElementById('inscricao_estadual').value = '';
            document.getElementById('tipo_preco').value = 'convencional';
            document.getElementById('declarante_terceiro').checked = false;
            document.getElementById('nome_declarante').value = '';
            document.getElementById('rg_declarante').value = '';
            document.getElementById('cpf_declarante').value = '';
            document.getElementById('endereco_declarante').value = '';
            document.getElementById('campo_declarante').classList.add('hidden');
            
            document.getElementById('lista-produtos').innerHTML = '';
            contadorProdutos = 0;
            
            voltarParaFormulario();
            
            alert("Todos os dados foram limpos com sucesso!");
        }
    }

    function voltarParaFormulario() {
        document.getElementById('area-impressao').classList.add('hidden');
        document.getElementById('formulario').classList.remove('hidden');
        window.scrollTo(0, 0);
    }

    function gerarAnexos() {
        const dados = {
            nome: document.getElementById('nome').value || "_________________________",
            cpf: document.getElementById('cpf').value || "_________________________",
            rg: document.getElementById('rg').value || "_________________________",
            estado_civil: document.getElementById('estado_civil').value || "_________________________",
            dap: document.getElementById('dap').value || "_________________________",
            nis: document.getElementById('nis').value || "_________________________",
            endereco: document.getElementById('endereco').value || "_________________________",
            municipio: document.getElementById('municipio').value || "_________________________",
            cep: document.getElementById('cep').value || "_________________________",
            telefone: document.getElementById('telefone').value || "_________________________",
            inscricao_estadual: document.getElementById('inscricao_estadual').value || "_________________________",
            nome_declarante: document.getElementById('nome_declarante').value || "_________________________",
            rg_declarante: document.getElementById('rg_declarante').value || "_________________________",
            cpf_declarante: document.getElementById('cpf_declarante').value || "_________________________",
            endereco_declarante: document.getElementById('endereco_declarante').value || "_________________________"
        };

        const dataAtual = formatarDataAtual();
        const declaranteTerceiro = document.getElementById('declarante_terceiro').checked;

        const produtos = [];
        const itens = document.querySelectorAll('.produto-item');
        let erro = false;
        
        itens.forEach(item => {
            const select = item.querySelector('.produto-select');
            const unidade = item.querySelector('.produto-unidade').value;
            const qtd = item.querySelector('.produto-qtd').value;
            const preco = item.querySelector('.produto-preco').value;
            const total = item.querySelector('.produto-total').value;
            const periodicidade = item.querySelector('.produto-periodicidade').value || "A definir";
            
            if (select.value !== "") {
                if (!qtd || qtd <= 0) {
                    erro = true; alert("Por favor, preencha a quantidade de todos os produtos selecionados."); return;
                }
                const produtoBase = tabelaPrecos[select.value];
                produtos.push({ nome: produtoBase.produto, unidade, quantidade: qtd, preco, total, periodicidade });
            }
        });

        if (erro) return;
        if (produtos.length === 0) { alert("Adicione pelo menos um produto."); return; }

        // Bloco de assinatura padrão (agricultor)
        const assinaturaAgricultor = `
            <div class="assinatura">
                <div>Assinatura e Nome do agricultor(a): ${dados.nome}<br>Número do CPF: ${dados.cpf}</div>
            </div>
        `;

        let htmlAnexos = '';

        // ANEXO I
        htmlAnexos += `
            <div class="anexo">
                <h3>ANEXO I - DECLARAÇÃO DE PRODUÇÃO PRÓPRIA PARA AGRICULTOR(A) FAMILIAR INDIVIDUAL</h3>
                <p>Edital de Chamamento Público SEMADESC/PAA/CDS nº. 003/2026.</p>
                <p>DECLARAÇÃO DE QUE OS GÊNEROS ALIMENTÍCIOS A SEREM ENTREGUES SÃO ORIUNDOS DE PRODUÇÃO PRÓPRIA, RELACIONADOS NO PROJETO DE VENDA.</p>
                <br>
                <p>Eu, <strong>${dados.nome}</strong>, nacionalidade brasileira, estado civil <strong>${dados.estado_civil}</strong>, Agricultor Familiar, portador(a) do RG/RANI n.º <strong>${dados.rg}</strong> e do CPF n.º <strong>${dados.cpf}</strong>, residente e domiciliado em <strong>${dados.endereco}, ${dados.municipio} - MS</strong>, DECLARO, para fins de participação no Chamamento Público de Credenciamento de Agricultores Familiares SEMADESC/PAA/CDS n.º 003/2026 para aquisição de gêneros alimentícios da agricultura familiar, no âmbito do Programa de Aquisição de Alimentos – Modalidade Compra com Doação Simultânea – com dispensa de licitação para doação a pessoas e famílias em situação de vulnerabilidade social, que os gêneros alimentícios relacionados na Proposta de Venda em meu nome são oriundos de produção própria.</p>
                <p>Declaro, ainda, estar ciente de que as Notas Fiscais Eletrônicas de Produtor a serem emitidas pela minha Inscrição Estadual, destinam-se exclusivamente à comercialização de minha própria produção, sendo vedada a cessão a terceiros.</p>
                <br>
                <p style="text-align: center;">Município de <strong>${dados.municipio}</strong>/MS, ${dataAtual}.</p>
                ${assinaturaAgricultor}
            </div>
        `;

        // ANEXO II
        htmlAnexos += `
            <div class="anexo">
                <h3>ANEXO II - DECLARAÇÃO DE RESPONSABILIDADE PELO CONTROLE DO ATENDIMENTO DO LIMITE INDIVIDUAL DE VENDA</h3>
                <p>Edital de Chamamento Público SEMADESC/PAA/CDS nº. 003/2026.</p>
                <br>
                <p>Eu, <strong>${dados.nome}</strong>, nacionalidade brasileira, Agricultor(a) Familiar, portador(a) do CPF n.º <strong>${dados.cpf}</strong>, residente e domiciliado (a) na área rural, denominada <strong>${dados.endereco}, ${dados.municipio} - MS</strong>, para fins de participação no Chamamento Público de Credenciamento de Agricultores Familiares SEMADESC n.º 003/2026 para aquisição de gêneros alimentícios da agricultura familiar, no âmbito do Programa de Aquisição de Alimentos – Modalidade Compra com Doação Simultânea – com dispensa de licitação, DECLARO que me responsabilizarei pelo controle do limite individual de venda anual de gêneros alimentícios, em até no valor de R$ 15.000,00 (quinze mil reais) por unidade familiar/CAF/modalidade PAA-CDS Termo de adesão, conforme Resolução GGPAA nº 3, de 5 de setembro de 2023 e demais normativos, no que couber.</p>
                <br>
                <p style="text-align: center;">Município de <strong>${dados.municipio}</strong>/MS, ${dataAtual}.</p>
                ${assinaturaAgricultor}
            </div>
        `;

        // ANEXO III
        let linhasProdutos = '';
        produtos.forEach(p => {
            linhasProdutos += `<tr><td>${p.nome}</td><td>${p.unidade}</td><td>${p.quantidade}</td><td>R$ ${p.preco}</td><td>R$ ${p.total}</td><td>${p.periodicidade}</td></tr>`;
        });

        htmlAnexos += `
            <div class="anexo">
                <h3>ANEXO III – PROJETO DE VENDA</h3>
                <p><strong>PROJETO DE VENDA DE GÊNEROS ALIMENTÍCIOS DA AGRICULTURA FAMILIAR PARA O PROGRAMA DE AQUISIÇÃO DE ALIMENTOS – PAA/CDS</strong></p>
                <p>Edital de Chamamento Público SEMADESC/PAA/CDS nº 003/2026.</p>
                <p>Proposta nº: 02636-DS-05860-2026-5000000- PAA/CDS.</p>
                <br>
                <h4>I – IDENTIFICAÇÃO DO FORNECEDOR</h4>
                <p>1. Nome do agricultor/a: <strong>${dados.nome}</strong></p>
                <p>2. CPF: <strong>${dados.cpf}</strong> | 3. Nº da DAP/CAF: <strong>${dados.dap}</strong> | 4. Nº NIS: <strong>${dados.nis}</strong></p>
                <p>5. Endereço: <strong>${dados.endereco}</strong></p>
                <p>6. Município: <strong>${dados.municipio}</strong> | 7. CEP: <strong>${dados.cep}</strong></p>
                <p>8. DDD/Fone: <strong>${dados.telefone}</strong></p>
                <br>
                <h4>II – PRODUTO</h4>
                <table>
                    <thead><tr><th>1. Produto</th><th>2. Unidade</th><th>3. Quantidade</th><th>4. Preço</th><th>5. Total</th><th>6. Periodicidade</th></tr></thead>
                    <tbody>${linhasProdutos}</tbody>
                </table>
                <br>
                <p style="text-align: center;">Município de <strong>${dados.municipio}</strong>/MS, ${dataAtual}.</p>
                ${assinaturaAgricultor}
            </div>
        `;

        // ANEXO V - Declaração de Residência (com 2 assinaturas)
        let blocoDeclarante = '';
        let blocoAssinaturaDeclarante = '';
        let blocoAssinaturaAgricultor = '';

        if (declaranteTerceiro) {
            blocoDeclarante = `<strong>${dados.nome_declarante}</strong>, portador(a) do RG/RANI nº __________________, inscrito(a) no CPF/CNPJ sob o nº __________________, residente e domiciliado em __________________`;
            blocoAssinaturaDeclarante = `
                <div class="assinatura">
                    <div>Assinatura e Nome do Declarante: ${dados.nome_declarante}<br>Número do CPF: __________________</div>
                </div>
            `;
        } else {
            blocoDeclarante = `<strong>${dados.nome}</strong>, portador(a) do RG/RANI nº <strong>${dados.rg}</strong>, inscrito(a) no CPF/CNPJ sob o nº <strong>${dados.cpf}</strong>, residente e domiciliado em <strong>${dados.endereco}, ${dados.municipio} - MS</strong>`;
            blocoAssinaturaDeclarante = `
                <div class="assinatura">
                    <div>Assinatura e Nome do Declarante: ${dados.nome}<br>Número do CPF: ${dados.cpf}</div>
                </div>
            `;
        }

        blocoAssinaturaAgricultor = `
            <div class="assinatura">
                <div>Assinatura e Nome do agricultor(a): ${dados.nome}<br>Número do CPF: ${dados.cpf}</div>
            </div>
        `;

        htmlAnexos += `
            <div class="anexo">
                <h3>ANEXO V – DECLARAÇÃO DE RESIDÊNCIA</h3>
                <p>Eu, ${blocoDeclarante}, DECLARO, para fins de participação no CHAMAMENTO PÚBLICO DA SEMADESC PAA/CDS Nº 003/2026, para aquisição de gêneros alimentícios da agricultura familiar, no âmbito do Programa de Aquisição de Alimentos – Modalidade Compra com Doação Simultânea – com dispensa de licitação, para doação a pessoas e famílias em situação de vulnerabilidade social, sob as penas da lei (Art. 299 do Código Penal Brasileiro e Lei nº 7.115/1983), que o(a) Sr.(a) <strong>${dados.nome}</strong>, inscrito no CPF sob o nº <strong>${dados.cpf}</strong>, detentor da Inscrição Estadual nº <strong>${dados.inscricao_estadual}</strong> e DAP/CAF ou NIS nº <strong>${dados.dap}</strong>, reside de forma efetiva e contínua no endereço, <strong>${dados.endereco}, ${dados.municipio} - MS</strong>, conforme comprovante em meu nome.</p>
                <br>
                <p style="text-align: center;">Município de <strong>${dados.municipio}</strong>/MS, ${dataAtual}.</p>
                ${blocoAssinaturaDeclarante}
                ${blocoAssinaturaAgricultor}
            </div>
        `;

        document.getElementById('conteudo-anexos').innerHTML = htmlAnexos;
        document.getElementById('area-impressao').classList.remove('hidden');
        document.getElementById('formulario').classList.add('hidden'); 
        window.scrollTo(0, 0);
    }
</script>
